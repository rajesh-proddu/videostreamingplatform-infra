apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: infra
spec:
  clusterIP: None
  # KRaft brokers must resolve each other's DNS during initial quorum
  # formation, before any broker is Ready. Without this, the headless
  # Service publishes no addresses until readiness, deadlocking startup.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
