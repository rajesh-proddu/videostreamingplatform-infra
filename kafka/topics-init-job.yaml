apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: infra
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          # Wait for all three brokers — RF=3 topic creation needs the full set.
          command: ['sh', '-c', 'for h in kafka-0 kafka-1 kafka-2; do until nc -z ${h}.kafka.infra.svc.cluster.local 9092; do echo "waiting for $h"; sleep 5; done; done']
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command:
            - /bin/bash
            - -c
            - |
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                --bootstrap-server kafka.infra.svc.cluster.local:9092 \
                --topic video-events --partitions 3 --replication-factor 3
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                --bootstrap-server kafka.infra.svc.cluster.local:9092 \
                --topic watch-events --partitions 6 --replication-factor 3
              # DLQ topics for poison-message routing. Explicit creation so the
              # consumers don't depend on broker auto-create being enabled.
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                --bootstrap-server kafka.infra.svc.cluster.local:9092 \
                --topic video-events-dlq --partitions 1 --replication-factor 3
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                --bootstrap-server kafka.infra.svc.cluster.local:9092 \
                --topic video-events-embeddings-dlq --partitions 1 --replication-factor 3
              # Notifications platform: subscription events (userservice producer),
              # notification events (rule engine -> per-channel consumer groups),
              # and the notification DLQ for poison/exhausted messages.
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                --bootstrap-server kafka.infra.svc.cluster.local:9092 \
                --topic subscription-events --partitions 3 --replication-factor 3
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                --bootstrap-server kafka.infra.svc.cluster.local:9092 \
                --topic notification-events --partitions 3 --replication-factor 3
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                --bootstrap-server kafka.infra.svc.cluster.local:9092 \
                --topic notification-events-dlq --partitions 1 --replication-factor 3
              echo "Topics created successfully"
