namespace: analytics

serviceAccount:
  name: analytics-sa
  # IRSA role ARN — set in values-aws.yaml only. Empty means no annotation.
  roleArn: ""

labels:
  app.kubernetes.io/part-of: videostreamingplatform
  app.kubernetes.io/component: analytics

image:
  registry: ghcr.io/rajesh-proddu/videostreamingplatform-analytics
  tag: latest
  pullPolicy: IfNotPresent

# Static env — identical across environments. Always set by the ConfigMap.
env:
  AWS_REGION: us-east-1
  ICEBERG_CATALOG_NAME: glue
  ICEBERG_CATALOG_TYPE: glue
  ICEBERG_GLUE_DATABASE: analytics

# Dynamic env — endpoints. Local defaults point at in-cluster + LocalStack;
# values-aws.yaml overrides the S3/Glue/Athena targets for real AWS.
envDynamic:
  KAFKA_BROKERS: kafka.infra.svc.cluster.local:9092
  ELASTICSEARCH_URL: http://elasticsearch.videostreamingplatform.svc.cluster.local:9200
  ICEBERG_WAREHOUSE: s3://iceberg-warehouse/
  GLUE_SCHEMA_REGISTRY_NAME: videostreamingplatform-dev
  ATHENA_WORKGROUP: ""
  ATHENA_RESULTS_BUCKET: ""
  # OTLP-HTTP base endpoint for traces; observability.py normalizes scheme.
  # Empty disables observability (matches Go-side convention).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.observability.svc.cluster.local:4318

kafkaEsConsumer:
  enabled: true
  replicas: 1
  image: kafka-es-consumer
  metricsPort: 9100
  extraEnv:
    KAFKA_VIDEO_TOPIC: video-events
    KAFKA_GROUP_ID: kafka-es-consumer
    ES_VIDEO_INDEX: videos
    OTEL_SERVICE_NAME: kafka-es-consumer
    METRICS_PORT: "9100"
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

watchHistoryConsumer:
  enabled: true
  replicas: 1
  image: watch-history-consumer
  metricsPort: 9100
  extraEnv:
    KAFKA_WATCH_TOPIC: watch-events
    KAFKA_GROUP_ID: watch-history-consumer
    ICEBERG_TABLE: analytics.watch_history
    OTEL_SERVICE_NAME: watch-history-consumer
    METRICS_PORT: "9100"
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 250m

catalogAdmin:
  image: catalog-admin
  init:
    enabled: true
    args: [create-tables]
  compaction:
    enabled: true
    schedule: "0 3 * * 0"
    args: [compact, analytics.watch_history]
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
  expireSnapshots:
    enabled: true
    schedule: "0 4 * * *"
    args: [expire-snapshots, analytics.watch_history]

# Daily batch — computes per-user feature vectors from Iceberg watch_history and
# upserts them to pgvector.user_features (read by the recommendations service).
userFeaturesJob:
  enabled: true
  schedule: "0 2 * * *"  # daily at 02:00 UTC
  image: feature-jobs
  extraEnv:
    PGVECTOR_URL: postgresql://recouser:recopass@pgvector.infra.svc.cluster.local:5432/recommendations
    USER_FEATURES_WINDOW_DAYS: "30"
    ICEBERG_TABLE: analytics.watch_history
    OTEL_SERVICE_NAME: user-features-job
  resources:
    requests:
      memory: 384Mi
      cpu: 200m
    limits:
      memory: 768Mi
      cpu: 500m

# Hourly batch — counts last-24h watches per video from Iceberg, writes top-N
# to pgvector.trending_videos (read by the recommendations service).
# Window > cadence on purpose: amortizes the freshest Iceberg partition's small-
# files cost across more-compacted older data.
trendingJob:
  enabled: true
  schedule: "5 * * * *"  # hourly at :05
  image: feature-jobs
  extraEnv:
    PGVECTOR_URL: postgresql://recouser:recopass@pgvector.infra.svc.cluster.local:5432/recommendations
    TRENDING_WINDOW_HOURS: "24"
    TRENDING_TOP_N: "100"
    ICEBERG_TABLE: analytics.watch_history
    OTEL_SERVICE_NAME: trending-job
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 250m
