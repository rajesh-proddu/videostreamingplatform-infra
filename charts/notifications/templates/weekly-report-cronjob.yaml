{{- if .Values.weeklyReport.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notifications-weekly-report
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  schedule: {{ .Values.weeklyReport.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: notifications-weekly-report
            {{- toYaml .Values.labels | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: Never
          containers:
            - name: weekly-report
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["./notifications", "weekly-report"]
              envFrom:
                {{- toYaml .Values.envFrom | nindent 16 }}
              env:
                {{- toYaml .Values.env | nindent 16 }}
              resources:
                {{- toYaml .Values.deployment.resources | nindent 16 }}
{{- end }}
